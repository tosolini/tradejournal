name: Dependabot PR Notification

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  notify:
    # Gate on the PR author, not the actor: on `reopened` events the actor is
    # whoever reopened the PR, which would silently skip dependabot PRs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      # Skip the email step until the SMTP secrets are fully configured;
      # otherwise every dependabot PR fails the check on an empty `to:`.
      MAIL_CONFIGURED: ${{ secrets.SMTP_SERVER != '' && secrets.SMTP_PORT != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.NOTIFICATION_EMAIL != '' }}
    steps:
      - name: Send email notification
        if: env.MAIL_CONFIGURED == 'true'
        # Pinned to commit SHA of v4 to avoid supply-chain risk now that this
        # workflow runs with repository secrets available (pull_request_target).
        uses: dawidd6/action-send-mail@611879133a9569642c41be66f4a323286e9b8a3b
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Dependabot] ${{ github.event.pull_request.title }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: Dependabot Notifier
          body: |
            A new Dependabot pull request has been opened:

            Repository: ${{ github.repository }}
            PR #: ${{ github.event.pull_request.number }}
            Title: ${{ github.event.pull_request.title }}
            Branch: ${{ github.event.pull_request.head.ref }}
            URL: ${{ github.event.pull_request.html_url }}

            Description:
            ${{ github.event.pull_request.body }}
